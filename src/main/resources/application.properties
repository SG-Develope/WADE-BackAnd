spring.application.name=wade-api

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

mybatis.mapper-locations=classpath:mapper/**/*.xml
mybatis.type-aliases-package=com.wade.wadeapi.domain
mybatis.configuration.map-underscore-to-camel-case=true

public.data.api-key=${PUBLIC_DATA_API_KEY}

hrfco.api-key=${HRFCO_API_KEY}

its.api-key=${ITS_API_KEY}

claude.api-key=${CLAUDE_API_KEY}

spring.sql.init.mode=always

server.port=${PORT:8080}

spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=120000
spring.datasource.hikari.keepalive-time=0
spring.datasource.hikari.connection-timeout=20000

cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}
